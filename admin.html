<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Admin · DXF → G-Code Generator</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="config.js"></script>
  <style>
    body.page-admin .admin-main{max-width:1440px;display:grid;grid-template-columns:minmax(280px,360px) minmax(0,1fr);align-items:start;gap:18px}
    body.page-admin .member-list-panel{position:sticky;top:18px;max-height:calc(100vh - 94px);display:flex;flex-direction:column;min-width:0}
    body.page-admin .member-list-panel .table-scroll{overflow:auto;min-height:180px}
    body.page-admin #userTable{min-width:0;margin-top:8px}
    body.page-admin #userTable th,body.page-admin #userTable td{padding:10px 8px}
    body.page-admin #userTable th:last-child,body.page-admin #userTable td:last-child{text-align:right;width:108px}
    body.page-admin #userTableBody tr{cursor:pointer;transition:background .12s,border-color .12s}
    body.page-admin #userTableBody tr:hover{background:var(--steel-750)}
    body.page-admin #userTableBody tr.selected-member{background:rgba(245,166,35,.13);box-shadow:inset 3px 0 0 var(--amber)}
    body.page-admin #userTableBody td:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:220px}
    body.page-admin .admin-detail{min-width:0;min-height:420px}
    body.page-admin .detail-placeholder{color:var(--ink-faint);display:flex;align-items:center;justify-content:center;min-height:320px;text-align:center;line-height:1.7}
    @media(max-width:860px){body.page-admin .admin-main{grid-template-columns:1fr}body.page-admin .member-list-panel{position:static;max-height:none}}
  </style>
</head>
<body class="page-admin">
  <div id="accessGate" class="access-gate">
    <div class="access-card">
      <span class="brand-mark">AP</span>
      <p id="accessMsg">กำลังตรวจสอบสิทธิ์แอดมิน...</p>
    </div>
  </div>

  <div id="appRoot" style="display:none">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">AP</span>
        <div class="brand-text">
          <strong>ADMIN PANEL</strong>
          <span class="brand-sub">USER &amp; ACCESS MANAGEMENT</span>
        </div>
      </div>
      <div class="topbar-actions">
        <span class="user-email" id="userEmail"></span>
        <a id="btnManualEditor" href="manual-editor.html" class="mini" style="text-decoration:none">แก้ไขคู่มือ</a>
        <button id="btnRefresh" class="mini">รีเฟรช</button>
        <button id="btnLogout" class="mini">ออกจากระบบ</button>
      </div>
    </header>

    <main class="admin-main">
      <section class="admin-panel member-list-panel">
        <p class="eyebrow">รายชื่อสมาชิกทั้งหมด</p>
        <div class="table-scroll">
          <table class="admin-table" id="userTable">
            <thead><tr><th>สมาชิก</th><th>สถานะ</th></tr></thead>
            <tbody id="userTableBody"><tr><td colspan="2" class="empty-hint">กำลังโหลด...</td></tr></tbody>
          </table>
        </div>
      </section>

      <section class="admin-panel admin-detail" id="detailPanel" style="display:none">
        <p class="eyebrow">รายละเอียด · <span id="detailEmail"></span></p>
        <div class="form-grid">
          <label class="fld"><span>สถานะ</span><select id="detailStatus"><option value="pending">รออนุมัติ (pending)</option><option value="active">ใช้งานได้ (active)</option><option value="suspended">ระงับสิทธิ์ (suspended)</option></select></label>
          <label class="fld"><span>ใช้ได้ถึงวันที่</span><input type="date" id="detailExpires"></label>
          <label class="fld"><span>Role</span><select id="detailRole"><option value="member">member</option><option value="admin">admin</option></select></label>
        </div>
        <button id="btnSaveUser" class="btn btn-accent" style="margin-top:12px">บันทึกการเปลี่ยนแปลง</button>
        <span id="saveUserMsg" class="save-indicator"></span>

        <p class="eyebrow" style="margin-top:24px">ประวัติการ Login ล่าสุด</p>
        <div class="login-log-hint">⚠ = Login จากเมืองหรือประเทศต่างกันภายใน 3 ชั่วโมงจากครั้งก่อน</div>
        <div class="table-scroll">
          <table class="admin-table small" id="logTable">
            <thead><tr><th></th><th>เวลา</th><th>IP</th><th>เมือง/ประเทศ</th><th>อุปกรณ์</th></tr></thead>
            <tbody id="logTableBody"><tr><td colspan="5" class="empty-hint">เลือกสมาชิกเพื่อดูประวัติ</td></tr></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <script src="auth-client.js"></script>
  <script src="admin.js"></script>
</body>
</html>
